name = "yul-evm-compiler"
version = "0.1.0"
defaultTargets = ["YulEvmCompiler", "YulParser", "YulEvmCompilerTests", "YulIR", "YulIRBench", "YulCApi", "Challenge"]

# Source-language semantics: the Yul big-step judgment this compiler is proved against.
[[require]]
name = "yul-semantics"
git = "https://github.com/powdr-labs/yul-semantics"
rev = "4c6f9753cc0e5850f6bdaf6fb0df76457204699a"

# Target-language semantics: the EVM small-step/big-step relations.
[[require]]
name = "evm_semantics"
git = "https://github.com/powdr-labs/evm-semantics"
rev = "601183cb2d959748243d59093c144652a6f10716"

[[lean_lib]]
name = "YulEvmCompiler"

[[lean_lib]]
name = "YulParser"

# C-ABI exports for embedding the compiler as a native library. The C shim,
# public header, and the static/shared library build live in c/ and
# scripts/build-c-lib.sh (which requests this lib's :static facet).
[[lean_lib]]
name = "YulCApi"

[[lean_lib]]
name = "YulEvmCompilerTests"

# The EIP-8200 "EVMification" challenge: the statement a candidate precompile
# replacement must satisfy, and the reduction that discharges it for bytecode
# this compiler produced. See Challenge/README.md.
[[lean_lib]]
name = "Challenge"

# Experimental optimizer IR (ANF, structured, named): Yul <-> IR translation and passes.
[[lean_lib]]
name = "YulIR"

# IR benchmark/baseline tooling (corpus + gas/round-trip checks). Depends on the
# compiler backend and the differential test harness, so it is kept out of the core
# `YulIR` library. The side-effecting runners (Update/CheckBaseline) are standalone
# scripts run with `lake env lean`, not part of this library.
[[lean_lib]]
name = "YulIRBench"
roots = ["YulIR.Check", "YulIR.Corpus"]

[[lean_exe]]
name = "yulc"
root = "YulParserMain"

# Built natively (not `lean --run`) because compiling large real-world Solidity
# contracts recurses deeper than the interpreter's stack allows.
[[lean_exe]]
name = "checkSolidityGas"
root = "scripts.CheckSolidityGas"

# Compile-only corpus checker: reports which fixtures the compiler REJECTS
# (e.g. via the stack-overflow gate), with no gas execution. Native for the
# same stack-depth reason as checkSolidityGas. Use `--baseline=<f>` to print the
# stale gas rows to drop after a gate change. See scripts/CheckSolidityCompileGate.lean.
[[lean_exe]]
name = "checkCompileGate"
root = "scripts.CheckSolidityCompileGate"

# The gas-baseline write side (see scripts/update-gas.sh). Native and
# fixture-parallel: a whole-corpus re-pin drops from an hour of interpreted
# single-threaded walking to minutes.
[[lean_exe]]
name = "updateCorpusGas"
root = "scripts.UpdateCorpusGas"

# Opcode-level gas attribution for one Solidity fixture: traces this
# compiler's and solc's runtimes side by side and aggregates executed gas by
# opcode group and by program counter. The diagnosis companion to
# checkSolidityGas: it localizes *where* a gas gap comes from. Native for the
# same stack-depth reason. See scripts/TraceSolidityGas.lean.
[[lean_exe]]
name = "traceSolidityGas"
root = "scripts.TraceSolidityGas"

# The SHA-256 challenge scorer: runs a candidate implementation (Yul source or
# raw bytecode) in the pinned executable EVM semantics and checks every vector
# against EvmSemantics.Crypto.Sha256.hash, reporting gas. Native for the same
# stack-depth reason as the corpus runners. See Challenge/README.md.
[[lean_exe]]
name = "sha256challenge"
root = "scripts.Sha256Challenge"

# The YulIR corpus benchmark/baseline runner (report/update/check). Native and
# fixture-parallel for the same reason as updateCorpusGas: the interpreted
# sequential walk dominated the size-baseline re-pin.
[[lean_exe]]
name = "yulIRCorpus"
root = "scripts.YulIRCorpus"
